<div class="rules">
  <h1>{{rule.game}}</h1>
  <h2>Les règles</h2>
  @for (item of rule.rules; track item; let i = $index) {
    <p [class.ketchup]="isEven(i)" [class.mayo]="!isEven(i)">
      {{item}}
    </p>
  }
  <button type="button" name="button" (click)="goToNextPage()">C'est compris?</button>
</div>
