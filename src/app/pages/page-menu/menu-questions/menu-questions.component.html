<div class="main-container">
  <app-scores class="scores" [team]="ketchup"></app-scores>
  <div class="questions" [class]="question?.team">
    <div class="container-que">
      <h1>{{question?.menu}}</h1>
      <h2>{{question?.question}}</h2>
    </div>
    <div class="container-rep">
      <ul class="reponses">
        @if (showAnswer) {
          <li class="rep">
            <p>{{question?.reponse}}</p>
          </li>
        }
      </ul>
    </div>
    <div class="buttons">
      <button type="button" name="button" (click)="showReponse()">
        Reponse
      </button>
      <button type="button" name="button" [disabled]="!showAnswer" (click)="nextQuestion()">
        Next
      </button>
    </div>

  </div>
  <app-scores class="scores" [team]="mayo"></app-scores>
</div>
